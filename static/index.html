<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 메뉴</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    margin: 0;
    background: #f2f2f2;
}

#menu-area {
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

.store {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 48%;
    box-sizing: border-box;
}

.store-name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
}

.menu-item {
    font-size: 20px;
    margin-top: 10px;
}

@media (max-width: 768px) {
    #menu-area {
        flex-direction: column;
    }

    .store {
        width: 100%;
    }
}
</style>
</head>

<body>

<h1>오늘의 메뉴</h1>
<h2 id="date"></h2>

<div id="menu-area"></div>

<script>

const socket = new WebSocket("wss://menu-board-2ajt.onrender.com/ws")

document.getElementById("date").innerText =
    new Date().toISOString().slice(0,10)

socket.onmessage = () => load()

async function load() {

    const res = await fetch("/menu")
    const data = await res.json()

    render(data)
}

function render(data) {

    const area = document.getElementById("menu-area")
    area.innerHTML = ""

    for (const store in data) {

        const div = document.createElement("div")
        div.className = "store"

        let html = `<div class="store-name">${store}</div>`

        data[store].forEach(menu => {
            html += `<div class="menu-item">- ${menu}</div>`
        })

        div.innerHTML = html
        area.appendChild(div)
    }
}

load()

</script>

</body>
</html>
