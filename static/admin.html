<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자</title>

<style>

body {
    font-family: Arial;
    padding: 40px;
    background: #f2f2f2;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 500px;
}

input, select, textarea, button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    font-size: 16px;
}

textarea {
    height: 200px;
}

</style>
</head>

<body>

<div class="container">

<h2>관리자 로그인</h2>

<input type="password" id="pw" placeholder="비밀번호">

<button onclick="login()">로그인</button>

<div id="panel" style="display:none;">

<h3>오늘 날짜: <span id="date"></span></h3>

<select id="store">
    <option>미가촌</option>
    <option>향기네</option>
</select>

<textarea id="menus"></textarea>

<button onclick="save()">저장</button>
<button onclick="clearAll()">전체삭제</button>

</div>

</div>

<script>

const PASS = "123"

function login() {
    if (document.getElementById("pw").value === PASS) {
        document.getElementById("panel").style.display = "block"
    }
}

document.getElementById("date").innerText =
    new Date().toISOString().slice(0,10)

async function save() {

    const msg =
        document.getElementById("store").value + "\n" +
        document.getElementById("menus").value

    await fetch("/sms", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message: msg})
    })

    alert("저장 완료")
}

async function clearAll() {

    await fetch("/clear", {method:"POST"})
    alert("삭제 완료")
}

</script>

</body>
</html>
